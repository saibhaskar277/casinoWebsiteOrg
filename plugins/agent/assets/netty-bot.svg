<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="64" height="64" role="img" aria-label="Netty Brains robot">
  <defs>
    <linearGradient id="gBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2A93B" stop-opacity="1"/>
      <stop offset="1" stop-color="#FF6B4A" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="gShell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF7E6"/>
      <stop offset="1" stop-color="#FFFBF0"/>
    </linearGradient>
  </defs>

  <!-- Outer shell -->
  <rect x="44" y="42" width="132" height="152" rx="22" fill="url(#gShell)" stroke="#0E2F42" stroke-opacity="0.22" stroke-width="4"/>
  <rect x="60" y="86" width="100" height="88" rx="16" fill="url(#gBody)" opacity="0.95"/>
  <rect x="78" y="118" width="64" height="16" rx="8" fill="#0E2F42" fill-opacity="0.14"/>

  <!-- Antenna -->
  <rect x="108" y="16" width="4" height="26" rx="2" fill="#0E2F42" fill-opacity="0.55"/>
  <circle cx="110" cy="10" r="10" fill="#F2A93B" stroke="#0E2F42" stroke-opacity="0.25" stroke-width="3"/>

  <!-- Eyes -->
  <g id="eyes">
    <ellipse id="eyeL" cx="82" cy="96" rx="18" ry="14" fill="#0E2F42" fill-opacity="0.16" stroke="#0E2F42" stroke-opacity="0.2" stroke-width="3"/>
    <ellipse id="eyeR" cx="138" cy="96" rx="18" ry="14" fill="#0E2F42" fill-opacity="0.16" stroke="#0E2F42" stroke-opacity="0.2" stroke-width="3"/>

    <circle id="pupilL" cx="82" cy="96" r="6" fill="#0E2F42" fill-opacity="0.65"/>
    <circle id="pupilR" cx="138" cy="96" r="6" fill="#0E2F42" fill-opacity="0.65"/>
  </g>

  <!-- Mouth -->
  <rect x="98" y="140" width="24" height="10" rx="5" fill="#0E2F42" fill-opacity="0.22"/>

  <!-- Decorative bolts -->
  <circle cx="62" cy="136" r="6" fill="#0E2F42" fill-opacity="0.1"/>
  <circle cx="158" cy="136" r="6" fill="#0E2F42" fill-opacity="0.1"/>
</svg>

