# GitHub Pages now only redirects to Firebase Hosting.
name: Deploy GitHub Pages redirect

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare redirect
        run: |
          mkdir -p _site
          cp pages-redirect.html _site/index.html
          if [ -f CNAME ]; then cp CNAME _site/CNAME; fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages + Actions source if the repo has not been configured yet
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
